<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Two Active Directory sites replicating over a cost-weighted site link, with FSMO roles on the first domain controller and an OU tree carrying a linked Group Policy Object">
<style>
  .an { font-family: "Anton", Impact, "Arial Black", sans-serif; fill: #f2ede1; }
  .ar { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; fill: #9a9aa4; }
  .mo { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; fill: #f0c000; }
  .box { fill: #16161c; stroke: #2c2c34; stroke-width: 3; }
  .dc  { fill: #131318; stroke: #d92020; stroke-width: 3; }
  .lnk { stroke: #2c2c34; stroke-width: 3; fill: none; }
  .rep { stroke: #d92020; stroke-width: 4; fill: none; }
  .ou  { stroke: #3a3a42; stroke-width: 3; fill: none; }

  /* Everything animates in on open. The delays walk the eye through the story:
     sites, then the link, then replication, then roles, then the OU tree. */
  .g { opacity: 0; animation: rise .5s cubic-bezier(.16,.9,.28,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); }
                    to   { opacity: 1; transform: none; } }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; }
  .d3 { animation-delay: .25s; } .d4 { animation-delay: .35s; }
  .d5 { animation-delay: .45s; } .d6 { animation-delay: .55s; }
  .d7 { animation-delay: .65s; }

  /* the site link draws itself, then replication runs along it both ways */
  .draw { stroke-dasharray: 300; stroke-dashoffset: 300;
          animation: draw .6s .3s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .flow { stroke-dasharray: 16 14; animation: flow 1.1s .9s linear infinite both; }
  @keyframes flow { to { stroke-dashoffset: -60; } }

  .pulse { animation: pulse 2.2s 1s ease-in-out infinite both; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  @media (prefers-reduced-motion: reduce) {
    .g, .draw, .flow, .pulse { animation: none !important; opacity: 1; }
    .draw { stroke-dashoffset: 0; }
  }
</style>

<!-- ================= SITES ================= -->
<g class="g d1">
  <rect x="18" y="16" width="336" height="196" class="box"/>
  <rect x="18" y="16" width="336" height="6" fill="#d92020"/>
  <text x="36" y="52" class="an" font-size="21">SITE A — HQ</text>
  <text x="36" y="74" class="ar" font-size="13">10.10.10.0 / 24</text>
</g>

<g class="g d2">
  <rect x="546" y="16" width="336" height="196" class="box"/>
  <rect x="546" y="16" width="336" height="6" fill="#d92020"/>
  <text x="564" y="52" class="an" font-size="21">SITE B — BRANCH</text>
  <text x="564" y="74" class="ar" font-size="13">10.10.20.0 / 24</text>
</g>

<!-- ================= DOMAIN CONTROLLERS ================= -->
<g class="g d3">
  <rect x="52" y="96" width="150" height="92" class="dc"/>
  <text x="70" y="128" class="an" font-size="19">DC01</text>
  <text x="70" y="150" class="ar" font-size="12">DNS · Global Catalog</text>
  <text x="70" y="170" class="ar" font-size="12" fill="#6e6e78">Windows Server 2022</text>
</g>

<g class="g d3">
  <rect x="580" y="96" width="150" height="92" class="dc"/>
  <text x="598" y="128" class="an" font-size="19">DC02</text>
  <text x="598" y="150" class="ar" font-size="12">DNS · Global Catalog</text>
  <text x="598" y="170" class="ar" font-size="12" fill="#6e6e78">Windows Server 2022</text>
</g>

<!-- ================= FSMO ROLES ================= -->
<g class="g d5">
  <text x="222" y="112" class="ar" font-size="11" fill="#6e6e78" letter-spacing="2">FSMO</text>
  <rect x="220" y="120" width="120" height="22" fill="#1e1e25" stroke="#f0c000" stroke-width="2"/>
  <text x="228" y="135" class="mo" font-size="10">Schema</text>
  <rect x="220" y="148" width="120" height="22" fill="#1e1e25" stroke="#f0c000" stroke-width="2"/>
  <text x="228" y="163" class="mo" font-size="10">Domain Naming</text>
  <rect x="220" y="176" width="120" height="22" fill="#1e1e25" stroke="#f0c000" stroke-width="2"/>
  <text x="228" y="191" class="mo" font-size="10">RID · PDC · Infra</text>
</g>

<!-- ================= SITE LINK + REPLICATION ================= -->
<path d="M354 130 L546 130" class="lnk draw"/>
<path d="M354 130 L546 130" class="rep flow"/>
<g class="g d4">
  <rect x="396" y="96" width="108" height="26" fill="#0b0b0d" stroke="#2c2c34" stroke-width="2"/>
  <text x="410" y="114" class="an" font-size="13" fill="#f0c000">COST 100</text>
  <text x="378" y="160" class="ar" font-size="12">AD Sites and Services</text>
  <text x="386" y="178" class="ar" font-size="12" fill="#6e6e78">site link · replication</text>
</g>

<!-- ================= OU TREE ================= -->
<g class="g d6">
  <text x="36" y="256" class="an" font-size="19">DOMAIN</text>
  <text x="36" y="276" class="ar" font-size="12" fill="#6e6e78">OU structure, Group Policy scoped per OU</text>

  <rect x="36" y="292" width="150" height="40" class="box"/>
  <text x="52" y="317" class="an" font-size="15">corp.local</text>

  <path d="M60 332 L60 372 L120 372" class="ou"/>
  <path d="M60 372 L60 420 L120 420" class="ou"/>

  <rect x="120" y="352" width="196" height="40" class="box"/>
  <text x="136" y="377" class="an" font-size="15">OU · WORKSTATIONS</text>

  <rect x="120" y="400" width="196" height="40" class="box"/>
  <text x="136" y="425" class="an" font-size="15">OU · SERVERS</text>
</g>

<!-- linked GPO -->
<g class="g d7">
  <path d="M316 372 L336 372" class="lnk"/>
  <rect x="336" y="352" width="188" height="40" fill="#131318" stroke="#f0c000" stroke-width="3"/>
  <text x="350" y="377" class="an" font-size="15" fill="#f0c000">GPO · DESKTOP POLICY</text>
  <text x="336" y="412" class="ar" font-size="12">linked at OU scope</text>
  <circle cx="326" cy="372" r="5" fill="#f0c000" class="pulse"/>
</g>

<!-- ================= CLIENT ACROSS THE BOUNDARY ================= -->
<g class="g d7">
  <rect x="580" y="292" width="172" height="40" class="box"/>
  <text x="596" y="317" class="an" font-size="15">WIN 11 CLIENT</text>
  <path d="M666 292 L666 188" class="lnk"/>
  <text x="580" y="356" class="ar" font-size="12">joined across the site boundary</text>
</g>

<!-- ================= PROOF ================= -->
<g class="g d7">
  <rect x="546" y="392" width="336" height="56" fill="#0b0b0d" stroke="#2c2c34" stroke-width="2"/>
  <text x="562" y="414" class="ar" font-size="11" fill="#6e6e78" letter-spacing="2">VERIFIED WITH</text>
  <text x="562" y="436" class="mo" font-size="13">repadmin /replsummary · netdom query fsmo</text>
</g>
</svg>
